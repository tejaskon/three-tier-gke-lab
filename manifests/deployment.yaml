apiVersion: apps/v1
kind: Deployment
metadata:
  name: three-tier-frontend-deployment
  labels:
    app: three-tier-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: three-tier-frontend
  template:
    metadata:
      labels:
        app: three-tier-frontend
    spec:
      containers:
      - name: app
        image: __IMAGE_PLACEHOLDER__
        ports:
        - containerPort: 3000
        resources:
          limits:
            cpu: "200m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: three-tier-service
spec:
  type: LoadBalancer
  selector:
    app: three-tier-frontend
  ports:
  - port: 80
    targetPort: 3000